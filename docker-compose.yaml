x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: srisu.settings
  DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
  # Development only: accept OTP requests without calling the expired Twilio trial.
  OTP_MOCK_DELIVERY: "${OTP_MOCK_DELIVERY:-true}"
  OTP_MOCK_CODE: "${OTP_MOCK_CODE:-123456}"
  # Append the backend laptop's LAN address for native mobile clients.
  DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},${SRISU_DEV_LAN_HOST-192.168.1.73}"
  POSTGRES_DB: "${POSTGRES_DB}"
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  # Container networking must use service names, regardless of host-native .env values.
  POSTGRES_HOST: srisu_db
  POSTGRES_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  AUTH_ACCEPT_LEGACY_TOKENS: "${AUTH_ACCEPT_LEGACY_TOKENS:-true}"
  SRISU_CONFIRM_DESTROY_LEGACY_CHAT: "${SRISU_CONFIRM_DESTROY_LEGACY_CHAT:-}"
  # Django controls relationship authorization and issues short-lived Synapse
  # JWT login credentials. The app then uses only standard Matrix APIs.
  MATRIX_ENABLED: "${MATRIX_ENABLED:-false}"
  MATRIX_SERVICE_CLASS: "${MATRIX_SERVICE_CLASS:-chat.services.matrix_provisioning.DisabledMatrixService}"
  MATRIX_HOMESERVER_URL: "${MATRIX_HOMESERVER_URL:-}"
  MATRIX_INTERNAL_HOMESERVER_URL: "${MATRIX_INTERNAL_HOMESERVER_URL:-http://synapse:8008}"
  MATRIX_SERVER_NAME: "${MATRIX_SERVER_NAME:-}"
  MATRIX_PROTOCOL_ID: "${MATRIX_PROTOCOL_ID:-matrix-e2ee-v1}"
  MATRIX_SESSION_TTL_SECONDS: "${MATRIX_SESSION_TTL_SECONDS:-120}"
  MATRIX_ACCESS_TOKEN_LIFETIME_SECONDS: "${MATRIX_ACCESS_TOKEN_LIFETIME_SECONDS:-300}"
  MATRIX_PROVISIONING_LOCALPART: "${MATRIX_PROVISIONING_LOCALPART:-srisu_provisioner}"
  MATRIX_ROOM_VERSION: "${MATRIX_ROOM_VERSION:-11}"
  MATRIX_JWT_SECRET: "${MATRIX_JWT_SECRET:-}"
  MATRIX_JWT_ALGORITHM: "${MATRIX_JWT_ALGORITHM:-HS256}"
  MATRIX_JWT_ISSUER: "${MATRIX_JWT_ISSUER:-srisu-django}"
  MATRIX_JWT_AUDIENCE: "${MATRIX_JWT_AUDIENCE:-srisu-matrix}"
  MATRIX_HTTP_TIMEOUT_SECONDS: "${MATRIX_HTTP_TIMEOUT_SECONDS:-5}"
  MATRIX_REMOTE_VERIFY_INTERVAL_SECONDS: "${MATRIX_REMOTE_VERIFY_INTERVAL_SECONDS:-300}"
  MATRIX_CUTOVER_ATTESTATION_TTL_SECONDS: "${MATRIX_CUTOVER_ATTESTATION_TTL_SECONDS:-300}"

x-app-dependencies: &app-dependencies
  srisu_db:
    condition: service_healthy
  redis:
    condition: service_healthy

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment: *app-environment
  volumes:
    - .:/app
  depends_on: *app-dependencies
  init: true

services:
  web:
    <<: *app-base
    command: daphne -b 0.0.0.0 -p 8000 srisu.asgi:application
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Durable retry loop for relationship-driven Matrix provisioning/revocation.
  # Django remains available if Synapse is temporarily down.
  matrix_reconciler:
    <<: *app-base
    command: python manage.py reconcile_matrix_rooms --watch --poll-interval 5 --limit 100
    restart: unless-stopped

  srisu_db:
    image: postgres:17
    container_name: srisuDB
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  synapse_db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${MATRIX_POSTGRES_DB:-srisu_matrix}"
      POSTGRES_USER: "${MATRIX_POSTGRES_USER:-srisu_matrix}"
      POSTGRES_PASSWORD: "${MATRIX_POSTGRES_PASSWORD:-}"
    volumes:
      - synapse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30

  synapse:
    image: ghcr.io/element-hq/synapse:v1.162.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/srisu-config/start-dev.sh"]
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      MATRIX_SERVER_NAME: "${MATRIX_SERVER_NAME:-}"
      MATRIX_HOMESERVER_URL: "${MATRIX_HOMESERVER_URL:-}"
      MATRIX_JWT_SECRET: "${MATRIX_JWT_SECRET:-}"
      MATRIX_JWT_ISSUER: "${MATRIX_JWT_ISSUER:-srisu-django}"
      MATRIX_JWT_AUDIENCE: "${MATRIX_JWT_AUDIENCE:-srisu-matrix}"
      MATRIX_ACCESS_TOKEN_LIFETIME_SECONDS: "${MATRIX_ACCESS_TOKEN_LIFETIME_SECONDS:-300}"
      MATRIX_PROVISIONING_LOCALPART: "${MATRIX_PROVISIONING_LOCALPART:-srisu_provisioner}"
      MATRIX_POSTGRES_DB: "${MATRIX_POSTGRES_DB:-srisu_matrix}"
      MATRIX_POSTGRES_USER: "${MATRIX_POSTGRES_USER:-srisu_matrix}"
      MATRIX_POSTGRES_PASSWORD: "${MATRIX_POSTGRES_PASSWORD:-}"
      MATRIX_MACAROON_SECRET: "${MATRIX_MACAROON_SECRET:-}"
      MATRIX_FORM_SECRET: "${MATRIX_FORM_SECRET:-}"
      PYTHONPATH: /srisu-config
    volumes:
      - ./deploy/synapse:/srisu-config:ro
      - synapse_data:/data
    ports:
      - "8008:8008"
    depends_on:
      synapse_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:8008/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
  synapse_postgres_data:
  synapse_data:
