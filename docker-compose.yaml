# Define the services (containers) to be created
services:
  # Web service (Django application)
  web:
    build:
      context: .            # Use the current directory as the build context
      dockerfile: Dockerfile # Specify the Dockerfile to use
    command: python manage.py runserver 0.0.0.0:8000 # Command to start the Django development server
    # command: watchfiles "daphne -b 0.0.0.0 -p 8000 srisu.asgi:application"
    volumes:
      - .:/app              # Mount the current directory into the container for live updates
    ports:
      - "8000:8000"         # Map port 8000 on the host to port 8000 in the container
    depends_on:
      srisu_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:            # Environment variables for Django
      - NOTIFICATIONS_ENABLED=${NOTIFICATIONS_ENABLED:-false}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-srisu-ef431}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-false}
      # Development only: accept OTP requests without calling the expired Twilio trial.
      # Set OTP_MOCK_DELIVERY=false to resume real SMS delivery.
      - OTP_MOCK_DELIVERY=${OTP_MOCK_DELIVERY:-true}
      # Shared development OTP, used only with mock delivery. Not a real credential.
      - OTP_MOCK_CODE=${OTP_MOCK_CODE:-123456}
      # Development server: append the mobile client's backend LAN host even when
      # an existing .env has a localhost-only allowlist. Empty SRISU_DEV_LAN_HOST
      # disables this addition; set it to another IP when changing laptops/networks.
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},${SRISU_DEV_LAN_HOST-192.168.1.73}
      # Match the names read by srisu.settings. Inside Docker, connect to the
      # service DNS name, independently of the host's non-Docker .env address.
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=srisu_db
      - DJANGO_SETTINGS_MODULE=srisu.settings
      - REDIS_HOST=redis
      - REDIS_PORT=6379


  notification_worker:
    profiles: [notifications]
    build: .
    command: python manage.py dispatch_notifications
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/tmp/srisu-notification-worker.heartbeat') < 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: srisu.settings
      POSTGRES_HOST: srisu_db
      REDIS_HOST: redis
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-srisu-ef431}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-adc.json
    volumes:
      - .:/app
      - ${SRISU_FIREBASE_ADC_PATH:-./.local/firebase-adc.json}:/run/secrets/firebase-adc.json:ro
    depends_on:
      srisu_db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Database service (PostgreSQL)
  srisu_db:
    image: postgres:17      # Use the official PostgreSQL image, version 17
    container_name: srisuDB
    restart: always          # Automatically restart the container if it crashes
    environment:             # Environment variables for PostgreSQL
      POSTGRES_USER: ${POSTGRES_USER} # PostgreSQL username
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # PostgreSQL password
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"         # Map port 5432 on the host to port 5432 in the container
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persist database data to a Docker volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
      image: redis:latest
      container_name: redis_server
      ports:
        - "6379:6379"
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 12
        start_period: 5s

# Define named volumes for persistent data storage
volumes:
  postgres_data:              # Volume for storing PostgreSQL data
